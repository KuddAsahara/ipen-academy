name: Build IPEN Academy Articles

on:
  push:
    branches:
      - main
    paths:
      - "Artikel/**"
      - "scripts/build_articles.py"
      - ".github/workflows/build-articles.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-articles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate article index
        run: python scripts/build_articles.py

      - name: Commit updated articles.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Artikel/articles.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automatically update article index"
            git push
          fi
