name: Build Article Index

on:
push:
branches:
- main
paths:
- ‘Artikel/*.md’
- ‘scripts/build_articles.py’
- ‘.github/workflows/build-articles.yml’

workflow_dispatch:

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4
  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.x'
  - name: Generate Article Index
    run: python scripts/build_articles.py
  - name: Save Article Index
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add Artikel/articles.json
      git diff --cached --quiet || git commit -m "Update article index"
      git push
