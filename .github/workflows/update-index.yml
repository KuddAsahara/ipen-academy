name: Update IPEN Academy Index

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate article and file indexes
        run: python scripts/generate_index.py

      - name: Commit updated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Artikel/articles.json Berkas/files.json

          if ! git diff --cached --quiet; then
            git commit -m "Update automatic content indexes"
            git push
          else
            echo "Indexes are already up to date."
          fi
