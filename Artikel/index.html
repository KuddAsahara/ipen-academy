<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artikel — IPEN Academy</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<header class="site-header">
    <div class="container header-inner">

        <a class="logo" href="/">IPEN<span>.</span></a>

        <nav class="navigation">
            <a href="/">Beranda</a>
            <a href="/List-Kelas/">List Kelas</a>
            <a href="/Artikel/">Artikel</a>
            <a href="/Berkas/">Berkas</a>
        </nav>

    </div>
</header>

<main>

    <section class="hero">
        <div class="container">

            <p class="eyebrow">02 / Knowledge & Publication</p>

            <h1>Artikel.</h1>

            <p class="hero-description">
                Kumpulan tulisan, pemikiran, kajian,
                dan berbagai artikel pengetahuan
                yang diterbitkan oleh IPEN Academy.
            </p>

        </div>
    </section>

    <section class="section">
        <div class="container">

            <input
                id="articleSearch"
                class="search-box"
                type="search"
                placeholder="Cari judul artikel..."
                aria-label="Cari artikel"
            >

            <div id="articleFilters" class="filters">

                <button
                    class="filter-button active"
                    data-category="Semua">
                    Semua
                </button>

                <button
                    class="filter-button"
                    data-category="Artikel">
                    Artikel
                </button>

            </div>

            <div id="articleList" class="content-list">
                <p class="muted">Memuat indeks artikel...</p>
            </div>

        </div>
    </section>

</main>

<footer class="site-footer">
    <div class="container footer-inner">

        <a class="logo" href="/">IPEN<span>.</span></a>

        <p>IPEN Academy — Knowledge & Publication</p>

    </div>
</footer>

<script>

const articleList = document.getElementById("articleList");
const articleSearch = document.getElementById("articleSearch");
const articleFilters = document.getElementById("articleFilters");

let articles = [];
let selectedCategory = "Semua";


function escapeHTML(value) {

    return String(value ?? "").replace(/[&<>"']/g, function(char) {

        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char];

    });

}


function renderArticles() {

    const query = articleSearch.value.toLowerCase().trim();

    const filtered = articles.filter(article => {

        const title = String(article.title || "");
        const author = String(article.author || "");
        const description = String(article.description || "");

        const matchesQuery =
            title.toLowerCase().includes(query) ||
            author.toLowerCase().includes(query) ||
            description.toLowerCase().includes(query);

        const matchesCategory =
            selectedCategory === "Semua" ||
            selectedCategory === "Artikel";

        return matchesQuery && matchesCategory;

    });


    if (filtered.length === 0) {

        articleList.innerHTML = `
            <div class="empty-state">

                <h3>Belum ada artikel yang cocok.</h3>

                <p>
                    Artikel yang diterbitkan akan muncul
                    secara otomatis setelah indeks diperbarui.
                </p>

            </div>
        `;

        return;

    }


    articleList.innerHTML = filtered.map((article, index) => {

        const title = escapeHTML(article.title);
        const author = escapeHTML(article.author || "IPEN Academy");
        const date = escapeHTML(article.date || "");

        let articleURL = "/Artikel/";

        try {

            const parsedURL = new URL(
                article.url,
                window.location.origin
            );

            if (
                parsedURL.origin === window.location.origin &&
                parsedURL.pathname.startsWith("/Artikel/baca/")
            ) {
                articleURL = parsedURL.pathname + parsedURL.search;
            }

        } catch (error) {

            console.error("URL artikel tidak valid:", error);

        }


        return `

            <a class="list-item"
               href="${escapeHTML(articleURL)}">

                <span class="list-number">
                    ${String(index + 1).padStart(2, "0")}
                </span>

                <div>

                    <h3>${title}</h3>

                    <p>
                        Artikel
                        · ${author}
                        ${date ? " · " + date : ""}
                    </p>

                </div>

                <span class="list-action">BACA ↗</span>

            </a>

        `;

    }).join("");

}


// Pencarian artikel
articleSearch.addEventListener("input", renderArticles);


// Filter artikel
articleFilters.addEventListener("click", event => {

    const button = event.target.closest("button[data-category]");

    if (!button) return;

    selectedCategory = button.dataset.category;

    articleFilters.querySelectorAll("button").forEach(item => {

        item.classList.toggle("active", item === button);

    });

    renderArticles();

});


// Mengambil indeks artikel
fetch("/Artikel/articles.json?t=" + Date.now())

    .then(response => {

        if (!response.ok) {

            throw new Error("Indeks artikel tidak ditemukan.");

        }

        return response.json();

    })

    .then(data => {

        articles = Array.isArray(data) ? data : [];

        renderArticles();

    })

    .catch(error => {

        console.error(error);

        articleList.innerHTML = `

            <div class="empty-state">

                <h3>Indeks artikel belum tersedia.</h3>

                <p>
                    Pastikan GitHub Actions berhasil
                    membuat Artikel/articles.json.
                </p>

            </div>

        `;

    });

</script>

</body>
</html>
