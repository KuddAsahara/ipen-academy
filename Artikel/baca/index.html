<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Baca Artikel — IPEN Academy</title>

    <link rel="stylesheet" href="/style.css">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
</head>

<body>

<header class="site-header">
    <div class="container header-inner">

        <a class="logo" href="/">IPEN<span>.</span></a>

        <nav class="navigation">
            <a href="/">Beranda</a>
            <a href="/List-Kelas/">List Kelas</a>
            <a href="/Artikel/">Artikel</a>
            <a href="/Berkas/">Berkas</a>
        </nav>

    </div>
</header>

<main class="container">

    <article class="article-reader">

        <a class="button" href="/Artikel/">
            ← Kembali ke Artikel
        </a>

        <div id="articleContent">
            <p class="muted">Memuat artikel...</p>
        </div>

    </article>

</main>

<footer class="site-footer">
    <div class="container footer-inner">
        <a class="logo" href="/">IPEN<span>.</span></a>
        <p>IPEN Academy — Articles</p>
    </div>
</footer>

<script>
const content = document.getElementById("articleContent");

const params = new URLSearchParams(window.location.search);
const file = params.get("file");

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char];
    });
}

function getMetadata(markdown) {
    const match = markdown.match(/^---\s*\r?\n([\s\S]*?)\r?\n---\s*\r?\n?/);

    const metadata = {};

    if (!match) {
        return { metadata, body: markdown };
    }

    match[1].split(/\r?\n/).forEach(line => {
        const separator = line.indexOf(":");

        if (separator === -1) return;

        const key = line.slice(0, separator).trim().toLowerCase();

        const value = line.slice(separator + 1)
            .trim()
            .replace(/^["']|["']$/g, "");

        metadata[key] = value;
    });

    return {
        metadata,
        body: markdown.slice(match[0].length)
    };
}

function showError(message) {
    content.innerHTML = `
        <div class="empty-state">
            <h2>Artikel tidak dapat dibuka.</h2>
            <p>${escapeHTML(message)}</p>
        </div>
    `;
}

if (!file ||
    !file.startsWith("Artikel/artikel/") ||
    !file.toLowerCase().endsWith(".md") ||
    file.split("/").includes("..") ||
    file.startsWith("/") ||
    file.includes("\\")) {

    showError("Alamat artikel tidak valid.");
} else {
    fetch("/" + file.split("/").map(encodeURIComponent).join("/"))
        .then(response => {
            if (!response.ok) {
                throw new Error("File artikel tidak ditemukan.");
            }

            return response.text();
        })
        .then(markdown => {
            const result = getMetadata(markdown);
            const metadata = result.metadata;
            const title = metadata.title || "Artikel IPEN Academy";

            document.title = title + " — IPEN Academy";

            const safeHTML = DOMPurify.sanitize(
                marked.parse(result.body)
            );

            content.innerHTML = `
                <p class="eyebrow">
                    ${escapeHTML(metadata.category || "Artikel")}
                </p>

                <h1>${escapeHTML(title)}</h1>

                ${
                    metadata.description
                        ? `<p class="muted">${escapeHTML(metadata.description)}</p>`
                        : ""
                }

                <hr>

                <div class="article-body">
                    ${safeHTML}
                </div>
            `;
        })
        .catch(error => {
            showError(error.message || "Terjadi kesalahan.");
        });
}
</script>

</body>
</html>
