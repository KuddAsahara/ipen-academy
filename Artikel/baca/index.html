<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Membaca Artikel | IPEN Academy</title>

    <link rel="stylesheet" href="../../style.css">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        .reader-container {
            max-width: 850px;
            margin: 40px auto;
            padding: 25px;
            background: white;
        }

        .article-content {
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .article-content img {
            max-width: 100%;
            height: auto;
        }

        .article-content pre {
            overflow-x: auto;
            padding: 15px;
            background: #f2f2f2;
        }

        .article-content blockquote {
            border-left: 4px solid #777;
            padding-left: 15px;
            color: #666;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

    <main class="reader-container">

        <a class="back-link" href="/Artikel/">
            ← Kembali ke daftar artikel
        </a>

        <article id="article-content" class="article-content">
            Memuat artikel...
        </article>

    </main>

    <script>

        async function loadArticle() {

            const content = document.getElementById("article-content");

            try {

                const params = new URLSearchParams(
                    window.location.search
                );

                const filename = params.get("file");

                if (!filename) {
                    throw new Error("Nama file artikel tidak ditemukan.");
                }

                const parts = filename.split("/");

                if (
                    filename.startsWith("/") ||
                    parts.some(part =>
                        !/^[a-zA-Z0-9_-]+\.md$/.test(part)
                    )
                ) {
                    throw new Error("Nama file artikel tidak valid.");
                }

                const fileURL =
                    "/Artikel/" +
                    parts.map(encodeURIComponent).join("/");

                const response = await fetch(fileURL);

                if (!response.ok) {
                    throw new Error("File artikel tidak ditemukan.");
                }

                const markdown = await response.text();

                const body = markdown.replace(
                    /^---[\s\S]*?---\s*/,
                    ""
                );

                content.innerHTML = marked.parse(body);

                document.title =
                    "Artikel | IPEN Academy";

            } catch (error) {

                content.innerHTML =
                    "<h2>Artikel tidak dapat dibuka</h2>" +
                    "<p>" + error.message + "</p>";

                console.error(error);

            }

        }

        loadArticle();

    </script>

</body>
</html>
