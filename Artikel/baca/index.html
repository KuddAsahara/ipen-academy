<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artikel | IPEN Academy</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        .article-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .article-card {
            background: #ffffff;
            border: 1px solid #dddddd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 18px;
        }

        .article-card h2 {
            margin-top: 0;
        }

        .article-card a {
            color: #2457a7;
            text-decoration: none;
        }

        .article-card a:hover {
            text-decoration: underline;
        }

        .article-meta {
            color: #777777;
            font-size: 14px;
        }

        .article-search {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 25px;
            border: 1px solid #cccccc;
            border-radius: 7px;
        }
    </style>
</head>

<body>

    <main class="article-container">

        <h1>Artikel IPEN Academy</h1>

        <p>
            Kumpulan artikel, pemikiran, pengetahuan,
            dan kajian dari IPEN Academy.
        </p>

        <input
            type="search"
            id="search"
            class="article-search"
            placeholder="Cari artikel..."
        >

        <div id="article-list">
            Memuat artikel...
        </div>

    </main>

    <script>
        const articleList = document.getElementById("article-list");
        const searchInput = document.getElementById("search");

        let articles = [];

        async function loadArticles() {

            try {

                const response = await fetch(
                    "./articles.json?t=" + Date.now()
                );

                if (!response.ok) {
                    throw new Error("Gagal mengambil articles.json");
                }

                articles = await response.json();

                displayArticles(articles);

            } catch (error) {

                articleList.innerHTML =
                    "<p>Artikel gagal dimuat. Silakan coba lagi nanti.</p>";

                console.error(error);

            }
        }

        function displayArticles(data) {

            articleList.innerHTML = "";

            if (data.length === 0) {

                articleList.innerHTML =
                    "<p>Belum ada artikel yang diterbitkan.</p>";

                return;
            }

            data.forEach(article => {

                const card = document.createElement("article");

                card.className = "article-card";

                const title = document.createElement("h2");
                const link = document.createElement("a");

                link.textContent = article.title;
                link.href = article.url;

                title.appendChild(link);

                const meta = document.createElement("p");
                meta.className = "article-meta";

                meta.textContent =
                    "Penulis: " + article.author +
                    (article.date ? " | " + article.date : "");

                const description = document.createElement("p");
                description.textContent = article.description;

                card.appendChild(title);
                card.appendChild(meta);
                card.appendChild(description);

                articleList.appendChild(card);

            });

        }

        searchInput.addEventListener("input", function () {

            const keyword = this.value.toLowerCase();

            const filtered = articles.filter(article => {

                return (
                    article.title.toLowerCase().includes(keyword) ||
                    article.author.toLowerCase().includes(keyword) ||
                    article.description.toLowerCase().includes(keyword)
                );

            });

            displayArticles(filtered);

        });

        loadArticles();
    </script>

</body>
</html>
